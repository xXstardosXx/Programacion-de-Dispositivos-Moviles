# Blueprint de Render — también puedes crear el Web Service a mano (ver RENDER.md).

services:
  - type: web
    name: questscore-api
    runtime: node
    plan: free
    rootDir: Rotten tomatoes/backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAWG_API_KEY
        sync: false
